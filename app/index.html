<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <aside class="chat">
    <header class="bar">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>Landfall</h1>
          <p class="sub">Draft damage assessments after a hurricane</p>
        </div>
      </div>
      <span class="badge" title="Every category is a draft for trained assessors, not an official determination">Draft</span>
    </header>

    <div class="log" id="log" aria-live="polite"></div>

    <form class="compose" id="compose">
      <div class="context" id="context"></div>
      <div class="row">
        <textarea id="input" rows="2" placeholder="Draw a box on the map, or ask about the area" aria-label="Message"></textarea>
        <button type="button" class="icon" id="mic" title="Ask by voice (Muse Voice Transcribe)" aria-label="Ask by voice">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <button type="submit" class="send" id="send">Send</button>
      </div>
    </form>
  </aside>

  <main class="map-wrap">
    <div id="map"></div>
    <div class="map-tools">
      <label class="field">
        <span>Area</span>
        <select id="area"></select>
      </label>
      <label class="field">
        <span>Storm</span>
        <select id="storm"></select>
      </label>
      <button type="button" id="draw" class="tool">Draw an area</button>
      <div class="seg" role="group" aria-label="Photo layer">
        <button type="button" data-layer="after" class="on">After storm</button>
        <button type="button" data-layer="map">Street map</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <section class="card" id="card" hidden>
      <button type="button" class="close" id="card-close" aria-label="Close">×</button>
      <div id="card-body"></div>
    </section>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
